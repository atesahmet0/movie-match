[project]
name = "movie-match"
version = "0.1.0"
description = "Find Letterboxd users from specific locations who liked or disliked movies, with anti-bot resilience."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ates", email = "ates@example.com" }]
dependencies = [
    "curl_cffi>=0.7.0",
    "selectolax>=0.3.20",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
movie-match = "movie_match.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
